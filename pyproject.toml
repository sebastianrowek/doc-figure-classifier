[project]
name = "documentfigureclassifier-v2-5"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling",
    "transformers",
    "pillow",
    "torch",
    "torchvision",
    "openai>=3.3.1",
    "liteparse>=2.12.0",
    "llama-cloud>=2.14.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "python-dotenv>=1.2.3",
]
