[project]
name = "documentfigureclassifier"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "docling",
    "transformers",
    "pillow",
    "torch",
    "torchvision",
    "openai>=3.3.1",
    "liteparse>=2.13,<2.14",
    "llama-cloud>=2.14.1",
    "datasets>=5.0.1",
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]   # uv init fills in the right pin
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "DocumentFigureClassifier" 

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "python-dotenv>=1.2.3",
]
eval = [
    "matplotlib>=3.9",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "seaborn>=0.13",
]
# Synthetic training-data generation. Kept out of the default dependencies so
# the inference environment stays lean -- nothing here is needed at inference.
synth = [
    "matplotlib>=3.9",
    "numpy>=2.0",
]
